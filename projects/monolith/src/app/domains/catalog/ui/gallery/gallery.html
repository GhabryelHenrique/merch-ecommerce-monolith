<div class="gallery">
  <div class="main">
    @for (image of current(); track image.src) {
      <img [ngSrc]="image.src" [alt]="image.alt" [width]="image.width" [height]="image.height" priority />
    }
  </div>

  @if (images().length > 1) {
    <div class="thumbs" role="group" aria-label="Imagens do produto" (keydown)="onKeydown($event)">
      @for (thumb of thumbnails(); track thumb.src; let i = $index) {
        <button
          #thumb
          type="button"
          class="thumb"
          [attr.aria-pressed]="i === safeIndex()"
          [attr.aria-label]="thumb.label"
          [attr.tabindex]="i === safeIndex() ? 0 : -1"
          (click)="select(i)"
        >
          <img [ngSrc]="thumb.src" alt="" width="96" height="96" />
        </button>
      }
    </div>
  }
</div>
