<button
  #opener
  type="button"
  class="opener"
  aria-haspopup="dialog"
  [attr.aria-expanded]="isOpen()"
  aria-controls="menu-mobile"
  (click)="open()"
>
  <merch-icon name="menu" />
  <span>Menu</span>
</button>

<!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -- clique no backdrop é atalho de mouse; Esc e o botão Fechar cobrem o teclado -->
<dialog
  #dialog
  id="menu-mobile"
  class="drawer"
  aria-labelledby="menu-mobile-titulo"
  (close)="onClosed()"
  (click)="onDialogClick($event)"
>
  <div class="drawer-body">
    <div class="drawer-header">
      <h2 id="menu-mobile-titulo" class="drawer-title">Menu</h2>
      <button type="button" class="close" aria-label="Fechar menu" (click)="close()">
        <merch-icon name="close" />
      </button>
    </div>

    <nav aria-label="Menu principal">
      <div ngAccordionGroup class="accordion">
        @for (section of sections; track section.label) {
          @if (section.children; as children) {
            <h3 class="item-heading">
              <button ngAccordionTrigger type="button" class="row" [panel]="panel">
                {{ section.label }}
                <merch-icon name="chevron-down" [size]="20" />
              </button>
            </h3>
            <div ngAccordionPanel #panel="ngAccordionPanel" class="panel">
              <ng-template ngAccordionContent>
                <ul role="list" class="links">
                  <li>
                    <a class="link link--all" [routerLink]="section.path">Ver tudo em {{ section.label }}</a>
                  </li>
                  @for (child of children; track trackLink(child)) {
                    <li>
                      <a class="link" [routerLink]="child.path" [queryParams]="child.query">{{ child.label }}</a>
                    </li>
                  }
                </ul>
              </ng-template>
            </div>
          } @else {
            <a class="row" [routerLink]="section.path">{{ section.label }}</a>
          }
        }
      </div>
    </nav>
  </div>
</dialog>
