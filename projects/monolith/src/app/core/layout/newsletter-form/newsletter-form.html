<form [formRoot]="newsletter" class="form" aria-labelledby="newsletter-titulo">
  <h2 id="newsletter-titulo" class="title">Receba novidades</h2>
  <p class="text">Cadastre-se e ganhe 10% de desconto na primeira compra.</p>
  <label for="newsletter-email" class="label">E-mail para novidades</label>
  <div class="row">
    <input
      id="newsletter-email"
      type="email"
      autocomplete="email"
      [formField]="newsletter.email"
      [attr.aria-invalid]="showError()"
      [attr.aria-describedby]="showError() ? 'newsletter-erro' : null"
    />
    <button merch-button type="submit">Cadastrar</button>
  </div>
  @if (showError()) {
    <p id="newsletter-erro" class="error">{{ errorMessage() }}</p>
  }
</form>
