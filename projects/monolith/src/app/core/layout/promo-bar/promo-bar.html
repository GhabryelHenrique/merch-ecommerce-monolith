@if (visible()) {
  <aside class="promo" aria-label="Promoção">
    <p class="message">
      {{ promo.message }}
      @if (promo.linkLabel) {
        @if (fragment) {
          <a [routerLink]="[]" [fragment]="fragment" queryParamsHandling="preserve">{{ promo.linkLabel }}</a>
        } @else {
          <a [routerLink]="promo.linkUrl">{{ promo.linkLabel }}</a>
        }
      }
    </p>
    <button type="button" class="close" aria-label="Dispensar promoção" (click)="dismiss()">
      <merch-icon name="close" [size]="18" />
    </button>
  </aside>
}
