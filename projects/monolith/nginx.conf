# Merch Store — SPA estática para Cloud Run (porta 8080).

# Hash no nome (main-XXXXXXXX.js, chunk-XXXXXXXX.js, styles-XXXXXXXX.css) → cache imutável.
map $uri $merch_cache_control {
    default                                                       "public, max-age=300";
    ~^/(index\.html)?$                                             "no-cache";
    ~^/config\.json$                                              "no-cache";
    "~^/(main|chunk|polyfills|styles)-[A-Za-z0-9_-]{8}\.(js|css)$" "public, max-age=31536000, immutable";
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain;

    # Cabeçalhos básicos de segurança (add_header não herda se o location definir os seus,
    # por isso ficam num include único aplicado em todos os locations).
    set $merch_csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";

    add_header Cache-Control $merch_cache_control always;
    add_header Content-Security-Policy $merch_csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Arquivos com extensão: serve ou 404 (nunca devolve index.html para asset quebrado).
    location ~* \.[a-z0-9]+$ {
        try_files $uri =404;
    }

    # Rotas da SPA → index.html (deep links como /p/camiseta-classica funcionam no F5).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
